function makeComparison(scene, index) {

  speedLabel.append(speed);
  const output = document.createElement('output'); output.textContent = '00:00 / ' + clock(scene.frames / scene.fps);
  const timeline = document.createElement('input'); timeline.type = 'range'; timeline.min = 0; timeline.max = scene.frames - 1; timeline.value = 0; timeline.step = 1; timeline.className = 'timeline'; timeline.disabled = true; timeline.setAttribute('aria-label', 'Comparison ' + (index + 1) + ' timeline');

async function preloadBundledVideo(task) {
  const blob = await assembleVideo(task,readVideoPart,{signal:pageDownloads.signal,onUpdate:updateLoading});
  const video=task.video;
  if (!task.blobUrl) task.blobUrl=URL.createObjectURL(blob);
  await new Promise((resolve,reject)=>{
    const timeout=setTimeout(()=>finish(new Error('Video decoding timed out.')),30000);
    function finish(error){clearTimeout(timeout);video.removeEventListener('loadeddata',loaded);video.removeEventListener('error',failed);pageDownloads.signal.removeEventListener('abort',aborted);error?reject(error):resolve();}

    function failed(){finish(new Error('Video cannot be decoded.'));}
    function aborted(){finish(new DOMException('Page closed','AbortError'));}
    video.addEventListener('loadeddata',loaded);video.addEventListener('error',failed);pageDownloads.signal.addEventListener('abort',aborted,{once:true});
    video.preload='auto';video.src=task.blobUrl;video.load();loaded();
  });

async function preloadAll() {

    catch (error) { if (error.name !== 'AbortError') { task.status = 'error'; task.error = error.message; } }

}
